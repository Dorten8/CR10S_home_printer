# CR-10S Upgrade - Master Klipper Configuration
# Board: BIGTREETECH SKR Mini E3 V3.0 (STM32G0B1RE)
# Extruder: Creality Sprite Extruder Pro (24V)
# Z-Probe: 3D Touch / BLTouch
# Filament Sensor: BTT Smart Filament Sensor (SFS) V2.0

[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_4B0031001250564837383520-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

# ==============================================================================
# STEPPER MOTORS & TMC2209 DRIVERS
# ==============================================================================

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: 0
position_max: 300
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 300
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 400
position_min: -5
homing_speed: 8
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 16
# Sprite Extruder Pro starting rotation distance (e-steps calibration baseline)
rotation_distance: 26.359
gear_ratio: 3.5:1
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150.0
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
stealthchop_threshold: 999999

# ==============================================================================
# HEATED BED (12V MOSFET Driven via SKR PC9 trigger)
# ==============================================================================

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
min_temp: 0
max_temp: 110
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182

# ==============================================================================
# FANS
# ==============================================================================

# Part Cooling Fan (Blower)
[fan]
pin: PC6

# Hotend Heatsink Fan (Auto-on at 50°C)
[heater_fan hotend_fan]
pin: PC7
heater: extruder
heater_temp: 50.0

# ==============================================================================
# Z-PROBE (3D Touch / BLTouch)
# ==============================================================================

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -31.8
y_offset: -40.5
z_offset: 0
stow_on_each_sample: True
probe_with_touch_mode: False
pin_up_touch_mode_reports_triggered: False
pin_up_reports_not_triggered: False

[safe_z_home]
home_xy_position: 181.8, 190.5 # Center of 300x300 bed with probe offset
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 30, 30
mesh_max: 265, 255
probe_count: 5, 5
algorithm: bicubic

# ==============================================================================
# FILAMENT SENSOR (BTT SFS V2.0)
# ==============================================================================

# Motion encoder sensor
[filament_motion_sensor sfs_encoder]
detection_length: 2.88
extruder: extruder
switch_pin: ^PC15
pause_on_runout: True
runout_gcode:
    M117 Filament encoder runout detected!
insert_gcode:
    M117 Filament encoder inserted.

# Switch sensor (Runout)
[filament_switch_sensor sfs_switch]
switch_pin: ^PC12
pause_on_runout: True
runout_gcode:
    M117 Filament runout switch triggered!
insert_gcode:
    M117 Filament inserted.

# ==============================================================================
# MAINSAIL / MOONRAKER INTEGRATION
# ==============================================================================

[virtual_sdcard]
path: /home/dorten/printer_data/gcodes

[display_status]

[pause_resume]

# ==============================================================================
# DIAGNOSTIC & SYSTEM READY TEST MACROS
# ==============================================================================

[gcode_macro STEPPER_BUZZ_ALL]
description: Buzzes X, Y, Z, and Extruder steppers to verify wiring and motion
gcode:
    M117 Buzzing X Stepper...
    STEPPER_BUZZ STEPPER=stepper_x
    G4 P2000
    M117 Buzzing Y Stepper...
    STEPPER_BUZZ STEPPER=stepper_y
    G4 P2000
    M117 Buzzing Z Stepper...
    STEPPER_BUZZ STEPPER=stepper_z
    G4 P2000
    M117 Buzzing Extruder...
    STEPPER_BUZZ STEPPER=extruder
    M117 Stepper buzz test complete!

[gcode_macro TEST_SENSORS]
description: Queries endstops, probes, and filament sensors
gcode:
    M117 Querying Endstops...
    QUERY_ENDSTOPS
    M117 Testing BLTouch pin deploy...
    BLTOUCH_DEBUG COMMAND=pin_down
    G4 P1000
    BLTOUCH_DEBUG COMMAND=pin_up
    M117 Querying Probe...
    QUERY_PROBE
    M117 Sensor test complete!

[gcode_macro SYSTEM_READY_TEST]
description: Performs safe stepper motion square and system readiness check
gcode:
    M117 Starting System Ready Test...
    # Pulse part fan
    M106 S255
    G4 P1000
    M106 S0
    # Test BLTouch pin
    BLTOUCH_DEBUG COMMAND=pin_down
    G4 P500
    BLTOUCH_DEBUG COMMAND=pin_up
    # Home axes safely
    M117 Homing Axes...
    G28
    # Motion Choreography (Safe Box Move at 50mm height)
    M117 Executing Motion Choreography...
    G90
    G1 Z50 F1000
    G1 X50 Y50 F6000
    G1 X250 Y50 F6000
    G1 X250 Y250 F6000
    G1 X50 Y250 F6000
    G1 X150 Y150 F6000
    M117 === CR-10S UPGRADE: ALL SYSTEMS GO ===

